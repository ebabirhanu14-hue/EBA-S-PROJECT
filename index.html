<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German School Of Excellence | Result Portal</title>
    <!-- CSS Moved inside head -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #3ca55c7a;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        input {
            width: 80%; /* Adjusted for better padding handling */
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #3f8f9fa7;
        }

        .hidden {
            display: none;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .summary {
            margin-top: 20px;
            text-align: right;
            border-top: 2px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>German School Of Excellence</h1>
            <p>Student Online Result Portal</p>
        </header>
        
        <div id="login-section" class="card">
            <h3>Check Your Result</h3>
            <input type="text" id="studentID" placeholder="Enter Student ID (e.g., GGA-001)">
            <button onclick="fetchResult()">Search Result</button>
        </div>
        
        <div id="result-section" class="card hidden">
            <h3 id="student-name">Student Name</h3>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Score</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- Rows will be inserted here by JS -->
                </tbody>
            </table>
            <div class="summary">
                <p><strong>Average Score:</strong> <span id="average">-</span></p>
                <p><strong>Status:</strong> <span id="status">-</span></p>
            </div>
            <button onclick="goBack()">New Search</button>
        </div>
    </div>

        function getGrade(score) {
            if (score >= 90) return "A";
            if (score >= 80) return "B";
            if (score >= 70) return "C";
            return "D"; // Assuming anything below 70 is D based on your logic
        }

        function fetchResult() {
            const id = document.getElementById('studentID').value.trim().toUpperCase();
            const student = studentData[id];

            if (student) {
                // Toggle visibility
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
                
                // Set Name
                document.getElementById('student-name').innerText = "Result for: " + student.name;

                const tbody = document.getElementById('results-body');
                tbody.innerHTML = ""; // Clear previous results
                
                let totalScore = 0;

                // Generate Table Rows
                student.results.forEach(item => {
                    const grade = getGrade(item.score);
                    const row = `<tr>
                        <td>${item.subject}</td>
                        <td>${item.score}</td>
                        <td>${grade}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                    totalScore += item.score;
                });

                // Calculate Average
                const average = (totalScore / student.results.length).toFixed(2);
                document.getElementById('average').innerText = average;

                // Determine Status (Pass if average >= 50)
                const statusSpan = document.getElementById('status');
                if (average >= 50) {
                    statusSpan.innerText = "Pass";
                    statusSpan.className = "pass";
                } else {
                    statusSpan.innerText = "Fail";
                    statusSpan.className = "fail";
                }

            } else {
                alert("Student ID not found. Please check the ID (e.g., GGA-001) and try again.");
            }
        }

        function goBack() {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('studentID').value = ""; // Clear input
        }
    </script>
